[build]
  # 构建命令
  command = "npm run build"
  # 构建输出目录（Vite 默认输出到 dist）
  publish = "dist"
  # Node.js 版本
  node_version = "18"

[build.environment]
  # 设置 Node.js 版本
  NODE_VERSION = "18"

# AI 代理：/api/ai -> Netlify Function，须置于 /* 之前以优先生效
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

# WebDAV 代理：/api/webdav/* -> Netlify Function，在服务端转发以规避浏览器 CORS
[[redirects]]
  from = "/api/webdav/*"
  to = "/.netlify/functions/webdav"
  status = 200

[[redirects]]
  from = "/api/webdav"
  to = "/.netlify/functions/webdav"
  status = 200

# 单页应用路由重写规则（因为使用了 HashRouter，这个可能不需要，但保留以防万一）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头设置
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
