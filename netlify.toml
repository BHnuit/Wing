# AI 函数 (/api/ai)：Netlify 默认 10 秒超时。若出现 504 或「请求超时 (504)」：
# - 建议：缩短当日记录、换用更快模型（如 gemini-2.0-flash）
# - Netlify Pro：可联系支持将函数超时延至 26 秒（在站点 Functions 设置或支持工单中配置）

[build]
  # 构建命令
  command = "npm run build"
  # 构建输出目录（Vite 默认输出到 dist）
  publish = "dist"
  # Node.js 版本
  node_version = "18"

[build.environment]
  # 设置 Node.js 版本
  NODE_VERSION = "18"

# AI 代理：/api/ai -> Netlify Function，须置于 /* 之前以优先生效
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

# 单页应用路由重写规则（因为使用了 HashRouter，这个可能不需要，但保留以防万一）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头设置
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
